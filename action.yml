name: "WASM Gas Profiler"
description: "Instruction-level WASM opcode analyzer and CPU fuel profiler for Soroban smart contracts"
branding:
  icon: "cpu"
  color: "orange"
inputs:
  wasm_path:
    description: "Path to compiled .wasm binary file"
    required: false
    default: ""
  out_json:
    description: "Path to export gas profile JSON"
    required: false
    default: "gas_profile.json"
  license_key:
    description: "OrderStream Pro/Enterprise license key (optional)"
    required: false
    default: ""
outputs:
  report_json:
    description: "Path to generated JSON profile"
    value: ${{ steps.profile.outputs.report_json }}
runs:
  using: "composite"
  steps:
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Build wasm-gas-profiler
      shell: bash
      run: |
        cargo build --release --manifest-path "${{ github.action_path }}/Cargo.toml" --target-dir "${{ github.action_path }}/target"
    - name: Run Gas Profiling
      id: profile
      shell: bash
      env:
        ORDERSTREAM_LICENSE_KEY: ${{ inputs.license_key }}
      run: |
        WASM_FLAG=""
        if [ -n "${{ inputs.wasm_path }}" ]; then
          WASM_FLAG="--wasm ${{ inputs.wasm_path }}"
        fi
        BIN="${{ github.action_path }}/target/release/wasm-gas-profiler"
        [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"
        "$BIN" profile $WASM_FLAG --out-json "${{ inputs.out_json }}"
        echo "report_json=${{ inputs.out_json }}" >> $GITHUB_OUTPUT
